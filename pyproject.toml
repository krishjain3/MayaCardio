[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mayacardio-pipeline"
version = "1.0.0"
description = "High-reliability dual-sensor biosignal pipeline for Raspberry Pi and Cloud with offline/online sync"
authors = [{ name = "MayaCardio Systems Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.0",
    "click>=8.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "werkzeug>=3.0.0"
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --durations=10"
